<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08192e"/>
      <stop offset="55%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#1d4b6d"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7BA7B0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#sal)" opacity="0.9"/>
  <defs>
    <linearGradient id="sal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7BA7B0"/>
      <stop offset="100%" stop-color="#E8B4A0"/>
    </linearGradient>
  </defs>
  <!-- Logo mark -->
  <g transform="translate(72, 64)">
    <polygon points="28,0 52,14 52,42 28,56 4,42 4,14" fill="#E8B4A0"/>
    <rect x="12" y="12" width="32" height="32" fill="#7BA7B0" rx="2"/>
    <circle cx="28" cy="28" r="9" fill="#1B3A5C"/>
  </g>
  <!-- Brand name -->
  <text x="138" y="86" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="4">ESTRATEGO TALENT</text>
  <!-- Category pill -->
  <rect x="72" y="214" width="140" height="36" rx="18" fill="rgba(232,180,160,0.15)" stroke="rgba(232,180,160,0.3)" stroke-width="1"/>
  <text x="92" y="236" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#E8B4A0" letter-spacing="1.5">RED GLOBAL</text>
  <!-- Title lines -->
  <text x="600" y="288" font-family="Plus Jakarta Sans, Arial Black, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="middle">Red global NPAworldwide — 550+ firmas</text>
  <text x="600" y="352" font-family="Plus Jakarta Sans, Arial Black, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="middle">en 50+ países</text>
  <!-- URL / footer -->
  <text x="600" y="566" font-family="Inter, Arial, sans-serif" font-size="16" fill="rgba(184,211,216,0.6)" text-anchor="middle">estratego.com.mx/red-global-npaworldwide</text>
</svg>