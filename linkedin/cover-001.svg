<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="440" viewBox="0 0 1376 440" font-family="Plus Jakarta Sans, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!--
    Portada de LinkedIn Newsletter "Pulso del Talento NL" — Edición 001
    Spec LinkedIn: 1376 × 440 px
    Logo Estratego: viewBox 100×100 canónico (igual al usado en favicons del sitio)
  -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2540"/>
      <stop offset="55%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#264C73"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7BA7B0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7BA7B0" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo canónico Estratego (mismas coordenadas que el favicon del sitio) -->
    <symbol id="estratego-logo" viewBox="0 0 100 100">
      <polygon points="50,4 93,27 93,73 50,96 7,73 7,27" fill="#E8B4A0"/>
      <rect x="24" y="24" width="52" height="52" fill="#7BA7B0" rx="3"/>
      <circle cx="50" cy="50" r="16" fill="#1B3A5C"/>
    </symbol>
  </defs>

  <!-- Fondo -->
  <rect width="1376" height="440" fill="url(#bg)"/>

  <!-- Glow suave detrás del título -->
  <circle cx="240" cy="240" r="320" fill="url(#glow)"/>

  <!-- Marca decorativa atrás del callout: el mismo logo Estratego en grande y translúcido -->
  <use href="#estratego-logo" x="940" y="20" width="400" height="400" opacity="0.08"/>

  <!-- Brand mark + wordmark (arriba a la izquierda) -->
  <g transform="translate(72,68)">
    <use href="#estratego-logo" x="0" y="0" width="44" height="44"/>
    <text x="58" y="20" fill="#FFFFFF" font-size="13" font-weight="800" letter-spacing="2.8">ESTRATEGO TALENT</text>
    <text x="58" y="38" fill="#E8B4A0" font-size="11" font-weight="600" letter-spacing="1">Reclutamiento y selección · Monterrey</text>
  </g>

  <!-- Chip de edición — ancho ajustado para que sea proporcional al título -->
  <g transform="translate(72,156)">
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#E8B4A0"/>
    <text x="20" y="24" fill="#0F2540" font-size="13" font-weight="800" letter-spacing="2.4">EDICIÓN 001 · MENSUAL · 2026</text>
  </g>

  <!-- Título -->
  <text x="72" y="246" fill="#FFFFFF" font-size="62" font-weight="800" letter-spacing="-1.5">Pulso del Talento NL</text>

  <!-- Subtítulo -->
  <text x="72" y="294" fill="#B8D3D8" font-size="22" font-weight="500">Sueldos, vacantes y movimientos del mercado</text>
  <text x="72" y="324" fill="#B8D3D8" font-size="22" font-weight="500">laboral en Monterrey y su zona metropolitana.</text>

  <!-- Pie con autor -->
  <g transform="translate(72,380)">
    <rect x="0" y="0" width="56" height="2" fill="#E8B4A0"/>
    <text x="0" y="26" fill="#FFFFFF" font-size="14" font-weight="700">Alejandro Russo</text>
    <text x="118" y="26" fill="#B8D3D8" font-size="13" font-weight="500">Director · Estratego Talent</text>
  </g>

  <!-- Callout numérico (métrica del mes) -->
  <g transform="translate(960,170)">
    <text x="0" y="0" fill="#E8B4A0" font-size="14" font-weight="700" letter-spacing="2">MÉTRICA DEL MES</text>
    <text x="0" y="92" fill="#FFFFFF" font-size="120" font-weight="800" letter-spacing="-3">38</text>
    <text x="0" y="126" fill="#B8D3D8" font-size="18" font-weight="500">días para cerrar una gerencia</text>
    <text x="0" y="150" fill="#B8D3D8" font-size="18" font-weight="500">en Monterrey hoy.</text>
  </g>
</svg>
