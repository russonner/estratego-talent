<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960"
     font-family="Plus Jakarta Sans, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <!--
    Portada LinkedIn Newsletter "Pulso del Talento NL" — Edición 001
    Spec REAL de LinkedIn Newsletter: 1920 × 960 (ratio 2:1)
    El 1376×440 anterior (3.13:1) salía cortado en los lados.

    Grilla:
      Márgenes: 120 left/right, 100 top/bottom
      Área segura LinkedIn (90% central): asegurar que TODO contenido crítico
      esté dentro de x=192..1728, y=96..864
      Columna izquierda: x=120..900 (ancho 780)
      Columna derecha:   x=1020..1800 (ancho 780)
      Gap entre columnas: 120 px
  -->

  <defs>
    <!-- Fondo primario: gradiente diagonal navy -->
    <linearGradient id="bgPrimary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0B1E36"/>
      <stop offset="55%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#264C73"/>
    </linearGradient>

    <!-- Brillo radial detrás del título -->
    <radialGradient id="glow" cx="22%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#7BA7B0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7BA7B0" stop-opacity="0"/>
    </radialGradient>

    <!-- Fondo secundario del callout -->
    <linearGradient id="bgCallout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Logo canónico Estratego -->
    <symbol id="estratego-logo" viewBox="0 0 100 100">
      <polygon points="50,4 93,27 93,73 50,96 7,73 7,27" fill="#E8B4A0"/>
      <rect x="24" y="24" width="52" height="52" fill="#7BA7B0" rx="3"/>
      <circle cx="50" cy="50" r="16" fill="#1B3A5C"/>
    </symbol>
  </defs>

  <!-- 1) Fondo primario -->
  <rect width="1920" height="960" fill="url(#bgPrimary)"/>

  <!-- 2) Brillo de fondo -->
  <rect width="1920" height="960" fill="url(#glow)"/>

  <!-- ===========================================================
       HEADER (y=100-180) — Brand mark
       =========================================================== -->
  <use href="#estratego-logo" x="120" y="100" width="64" height="64"/>
  <text x="204" y="132" fill="#FFFFFF" font-size="18" font-weight="800" letter-spacing="4">ESTRATEGO TALENT</text>
  <text x="204" y="158" fill="#E8B4A0" font-size="14" font-weight="600" letter-spacing="1.4">Reclutamiento y selección · Monterrey, Nuevo León</text>

  <!-- Divisor sutil debajo del header -->
  <line x1="120" y1="220" x2="1800" y2="220" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>

  <!-- ===========================================================
       COLUMNA IZQUIERDA — Chip + Título + Subtítulo
       =========================================================== -->

  <!-- Chip de edición -->
  <rect x="120" y="288" width="480" height="52" rx="26" fill="#E8B4A0"/>
  <text x="148" y="322" fill="#0F2540" font-size="17" font-weight="800" letter-spacing="3">EDICIÓN 001  ·  MENSUAL  ·  MAYO 2026</text>

  <!-- Título principal (puede ocupar 2 líneas si es necesario) -->
  <text x="120" y="448" fill="#FFFFFF" font-size="92" font-weight="800" letter-spacing="-2.5">Pulso del</text>
  <text x="120" y="548" fill="#FFFFFF" font-size="92" font-weight="800" letter-spacing="-2.5">Talento NL</text>

  <!-- Subtítulo -->
  <text x="120" y="620" fill="#B8D3D8" font-size="26" font-weight="500">Sueldos, vacantes y movimientos del mercado laboral</text>
  <text x="120" y="656" fill="#B8D3D8" font-size="26" font-weight="500">en Monterrey y su zona metropolitana.</text>

  <!-- ===========================================================
       COLUMNA DERECHA — Callout métrica del mes
       Card centrada verticalmente: y=300..680 (alto 380)
       =========================================================== -->

  <!-- Tarjeta translúcida -->
  <rect x="1080" y="300" width="720" height="380" rx="20"
        fill="url(#bgCallout)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Marca de agua: logo en esquina inferior derecha de la tarjeta -->
  <use href="#estratego-logo" x="1620" y="500" width="170" height="170" opacity="0.10"/>

  <!-- Etiqueta -->
  <text x="1116" y="362" fill="#E8B4A0" font-size="18" font-weight="800" letter-spacing="3">MÉTRICA DEL MES</text>

  <!-- Número grande -->
  <text x="1116" y="540" fill="#FFFFFF" font-size="200" font-weight="800" letter-spacing="-6">38</text>

  <!-- Descripción del número -->
  <text x="1116" y="600" fill="#B8D3D8" font-size="24" font-weight="500">días para cerrar una gerencia</text>
  <text x="1116" y="634" fill="#B8D3D8" font-size="24" font-weight="500">en Monterrey hoy.</text>

  <!-- ===========================================================
       FOOTER (y=780-860) — Autor + URL
       =========================================================== -->

  <!-- Divisor superior del footer -->
  <line x1="120" y1="760" x2="1800" y2="760" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Barra de acento -->
  <rect x="120" y="800" width="64" height="3" fill="#E8B4A0"/>

  <!-- Autor -->
  <text x="120" y="848" fill="#FFFFFF" font-size="20" font-weight="700">Alejandro Russo</text>
  <text x="320" y="848" fill="#B8D3D8" font-size="18" font-weight="500">Director · Estratego Talent</text>

  <!-- URL en el lado derecho -->
  <text x="1800" y="848" fill="#B8D3D8" font-size="18" font-weight="500" text-anchor="end">estratego.com.mx</text>
</svg>
